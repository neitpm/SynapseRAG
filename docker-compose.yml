services:
  # ============================================================================
  # 1. MESSAGE BROKER: Redpanda (Kafka compatible)
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: graphrag-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: graphrag-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ============================================================================
  # 2. GRAPH & VECTOR DATABASE: Neo4j 5.20+
  # ============================================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/graphrag_password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 3. RAW DATA LAKE: Cassandra 4.1
  # ============================================================================
  cassandra:
    image: cassandra:4.1
    container_name: graphrag-cassandra
    ports:
      - "9042:9042" # CQL native transport port
    environment:
      - CASSANDRA_CLUSTER_NAME=SynapseCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra

  # ============================================================================
  # 4. BACKEND GRAPHQL GATEWAY & SSE STREAM (Query Pipeline)
  # ============================================================================
  rag-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: graphrag-gateway
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphrag_password123
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CASSANDRA_HOSTS=cassandra
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # ============================================================================
  # 5. FRONTEND 3D VISUALIZER (React + Three.js Dashboard)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: graphrag-frontend
    ports:
      - "5173:80"
    depends_on:
      - rag-gateway

volumes:
  redpanda_data:
  neo4j_data:
  cassandra_data:
