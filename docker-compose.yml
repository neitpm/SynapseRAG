version: '3.8'

services:
  # ============================================================================
  # 1. MESSAGE BROKER: Redpanda
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: graphrag-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: graphrag-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ============================================================================
  # 2. GRAPH & VECTOR DATABASE: Neo4j 5.20+ (Hỗ trợ Vector Index)
  # ============================================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/graphrag_password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data

  # ============================================================================
  # 3. RAW DATA LAKE: Cassandra (hoặc ScyllaDB tương thích CQL 100%)
  # ============================================================================
  cassandra:
    image: cassandra:4.1
    container_name: graphrag-cassandra
    ports:
      - "9042:9042" # CQL native transport port
    environment:
      - CASSANDRA_CLUSTER_NAME=SynapseCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  redpanda_data:
  neo4j_data:
  cassandra_data:
