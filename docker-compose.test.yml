services:
  neo4j-chaos-test:
    image: neo4j:5.20-community
    container_name: graphrag-neo4j-chaos-test
    ports:
      - "7475:7474" # Test HTTP UI
      - "7688:7687" # Test Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/chaos_test_password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=256M
      - NEO4J_dbms_memory_heap_max__size=512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
